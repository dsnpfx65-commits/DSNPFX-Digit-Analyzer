name: Import recovered DSNPFX runtime

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Check out redesign branch
        uses: actions/checkout@v4
        with:
          ref: redesign-market-insight
          fetch-depth: 0

      - name: Rebuild and extract recovered clean runtime
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(.bootstrap/runtime.b64.part*)
          if [ ${#parts[@]} -eq 0 ]; then
            echo "Runtime parts are not staged."
            exit 1
          fi
          cat "${parts[@]}" | base64 --decode > /tmp/DSNPFX-RUNTIME.zip
          unzip -t /tmp/DSNPFX-RUNTIME.zip >/dev/null
          unzip -q -o /tmp/DSNPFX-RUNTIME.zip -d .
          rm -rf .bootstrap
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*_backup.py' -o -name '*.bak' \) -delete

      - name: Validate Python source
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q backend

      - name: Commit imported runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DSNPFX Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Import recovered DSNPFX runtime and Market Insight redesign"
          git push origin HEAD:redesign-market-insight
