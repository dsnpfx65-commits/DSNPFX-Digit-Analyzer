name: Import recovered DSNPFX runtime

on:
  push:
    branches:
      - redesign-market-insight
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-runtime:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out redesign branch
        uses: actions/checkout@v4
        with:
          ref: redesign-market-insight
          fetch-depth: 0

      - name: Rebuild and extract validated intelligence engine
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(.bootstrap/runtime-engine.b64.part*)
          if [ ${#parts[@]} -ne 4 ]; then
            echo "Expected 4 validated runtime-engine parts, found ${#parts[@]}."
            exit 1
          fi
          cat "${parts[@]}" | base64 --decode > /tmp/DSNPFX-RUNTIME-ENGINE.tar.xz
          echo "d4ed1e47080dda3f6a0d67d32b1cbc033b8b3c1b079271f150a235b70f54f7af  /tmp/DSNPFX-RUNTIME-ENGINE.tar.xz" | sha256sum -c -
          tar -xJf /tmp/DSNPFX-RUNTIME-ENGINE.tar.xz -C .
          rm -rf .bootstrap
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*_backup.py' -o -name '*.bak' \) -delete

      - name: Install runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q -r requirements.txt

      - name: Validate active Python source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import py_compile

          checked = 0
          for path in Path('backend').rglob('*.py'):
              if path.name.endswith('_backup.py') or '.bak' in path.name:
                  continue
              py_compile.compile(str(path), doraise=True)
              checked += 1
          print(f'ACTIVE CODE COMPILE: PASS ({checked} files)')
          PY

      - name: Smoke-test Market Insight engine bridge
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          from backend.core.volatility_web_runner import _market_payload, run_forever

          payload = _market_payload(
              {
                  'symbol': 'R_100',
                  'status': 'LIVE',
                  'market_quality': 'TEN_DIGIT',
                  'premium': False,
                  'prediction': None,
              },
              {
                  'R_100': {
                      'quote': '123.40',
                      'displayed_quote': '123.40',
                      'digit': 0,
                  }
              },
          )
          assert callable(run_forever)
          assert payload['displayed_price'] == '123.40'
          assert payload['last_digit'] == 0
          assert payload['decision'] == 'WAIT'
          assert payload['published_prediction'] is None
          print('ENGINE BRIDGE: PASS')
          PY

      - name: Commit imported intelligence engine
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DSNPFX Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Connect recovered DSNPFX intelligence engine to Market Insight"
          git push origin HEAD:redesign-market-insight
